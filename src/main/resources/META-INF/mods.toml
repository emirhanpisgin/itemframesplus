# https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml
modLoader="javafml"
loaderVersion="[${fml},)"
license="MIT"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
description="Makes item frames more useful by shrinking hitboxes and making them invisible."
license="MIT"

[[dependencies.${id}]]
modId="forge"
mandatory=true
versionRange="[${fml},)"
ordering="NONE"
side="BOTH"

[[dependencies.${id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="itemframesplus.mixins.json"
